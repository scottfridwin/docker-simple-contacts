server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy the API to the backend service (same-origin, no CORS needed).
  location /api/ {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: route all unknown paths to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Do not cache the service worker or the app shell aggressively.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Long-cache fingerprinted assets.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
