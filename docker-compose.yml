name: contacts

secrets:
  db_password:
    file: ${DB_PASSWORD_SECRET_FILE:-./secrets/db_password}

services:
  postgres:
    image: postgres:17-alpine
    user: "${POSTGRES_UID:-70}:${POSTGRES_GID:-70}"
    read_only: true
    mem_limit: ${POSTGRES_MEM_LIMIT:-512m}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-256}
    secrets:
      - db_password
    environment:
      POSTGRES_USER: ${DB_USER:-contacts}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:uid=${POSTGRES_UID:-70},gid=${POSTGRES_GID:-70},mode=1777
      - /var/run/postgresql:uid=${POSTGRES_UID:-70},gid=${POSTGRES_GID:-70},mode=2775
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contacts} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ${BACKEND_IMAGE:-ghcr.io/scottfridwin/contacts-backend}:${CONTACTS_VERSION:-latest}
    user: "${APP_UID:-65532}:${APP_GID:-65532}"
    read_only: true
    mem_limit: ${APP_MEM_LIMIT:-256m}
    pids_limit: ${APP_PIDS_LIMIT:-128}
    secrets:
      - db_password
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: ${ENV:-production}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-contacts}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSLMODE: disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      PURGE_AFTER_DAYS: ${PURGE_AFTER_DAYS:-30}
    ports:
      - "${APP_PUBLISH_PORT:-8080}:8080"
    tmpfs:
      - /tmp:uid=${APP_UID:-65532},gid=${APP_GID:-65532},mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/scottfridwin/contacts-frontend}:${CONTACTS_VERSION:-latest}
    user: "${FRONTEND_UID:-101}:${FRONTEND_GID:-101}"
    read_only: true
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-64}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://app:8080}
    ports:
      - "${FRONTEND_PUBLISH_PORT:-5173}:8080"
    tmpfs:
      - /tmp:uid=${FRONTEND_UID:-101},gid=${FRONTEND_GID:-101},mode=1777
      - /etc/nginx/conf.d:uid=${FRONTEND_UID:-101},gid=${FRONTEND_GID:-101},mode=0755
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
