openapi: 3.0.3
info:
  title: Contacts API
  version: 1.0.0
  description: >-
    Self-hosted contact management API. Supports Person records and optional
    Authentik OIDC SSO. When SSO is configured, Person records are account-scoped.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    get:
      summary: Start Authentik login
      operationId: startLogin
      responses:
        '302': { description: Redirect to Authentik }
  /auth/callback:
    get:
      summary: Complete Authentik login
      operationId: completeLogin
      responses:
        '302': { description: Redirect to the application }
  /auth/logout:
    post:
      summary: End the current session
      operationId: logout
      responses:
        '204': { description: Session ended }
  /persons:
    get:
      summary: List persons
      operationId: listPersons
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_name, display_name, first_name, created_at, updated_at]
            default: last_name
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: first_name
          in: query
          schema: { type: string }
        - name: last_name
          in: query
          schema: { type: string }
        - name: favorite
          in: query
          description: Filter to only (true) or exclude (false) favorited contacts.
          schema: { type: boolean }
      responses:
        '200':
          description: A page of persons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonListResponse'
    post:
      summary: Create a person
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
  /persons/deleted:
    get:
      summary: List deleted persons
      operationId: listDeletedPersons
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_name, display_name, first_name, created_at, updated_at]
            default: last_name
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        '200':
          description: A page of deleted persons
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonListResponse' }
  /persons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a person by ID
      operationId: getPerson
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a person
      operationId: updatePerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Soft-delete a person (recoverable for 30 days)
      operationId: deletePerson
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/NotFound'
  /persons/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Restore a deleted person
      operationId: restorePerson
      responses:
        '204': { description: Restored }
        '404': { $ref: '#/components/responses/NotFound' }
  /persons/{id}/permanent:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Permanently delete a deleted person
      operationId: permanentlyDeletePerson
      responses:
        '204': { description: Permanently deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /persons/{id}/relationships:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List a person's relationships (both directions)
      operationId: listRelationships
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Relationship' }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a relationship from this person's perspective
      operationId: createRelationship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRelationshipInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /persons/{id}/relationships/{relationshipId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: relationshipId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Delete a relationship (from either side)
      operationId: deleteRelationship
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /persons/{id}/shares:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List a person's shares (owner-only)
      operationId: listShares
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Share' }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Share this person with another account by email (owner-only)
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /persons/{id}/shares/{shareId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: shareId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Revoke a share (owner-only)
      operationId: deleteShare
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /persons/{id}/shares/mine:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Remove the caller's own access to a contact shared with them (recipient-only)
      operationId: leaveShare
      responses:
        '204': { description: Left }
        '404': { $ref: '#/components/responses/NotFound' }
  /sync-accounts:
    get:
      summary: List sync accounts
      operationId: listSyncAccounts
      responses:
        '200':
          description: A list of sync accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAccountListResponse'
    post:
      summary: Create a sync account
      operationId: createSyncAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSyncAccountInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAccount'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sync-accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a sync account by ID
      operationId: getSyncAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAccount'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a sync account
      operationId: updateSyncAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSyncAccountInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAccount'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Delete a sync account
      operationId: deleteSyncAccount
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /sync/google/begin:
    get:
      summary: Begin Google OAuth for contact sync
      operationId: beginGoogleSyncOAuth
      parameters:
        - name: redirect_uri
          in: query
          required: false
          schema: { type: string, format: uri }
      responses:
        '200':
          description: OAuth authorization URL and CSRF state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleOAuthBeginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
  /sync/google/callback:
    get:
      summary: Complete Google OAuth and trigger initial two-way sync
      operationId: completeGoogleSyncOAuth
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Connected Google sync account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAccount'
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    contactsSession:
      type: apiKey
      in: cookie
      name: contacts_session
  schemas:
    CustomFieldValue:
      description: A scalar custom field value. Dates are ISO-8601 strings.
      oneOf:
        - type: string
        - type: number
        - type: boolean
    CustomFields:
      type: object
      maxProperties: 64
      additionalProperties:
        $ref: '#/components/schemas/CustomFieldValue'
      description: >-
        Map of freeform (any non-empty, printable, case-sensitive) keys to
        scalar values. Max 64 fields; key max 64 chars; string value max
        1024 chars. Synced bidirectionally with Google Contacts as
        userDefined entries.
    LabeledValue:
      type: object
      required: [label, value]
      properties:
        label: { type: string, maxLength: 50, example: mobile }
        value: { type: string }
      description: A single labeled entry, used for both emails and phone numbers.
    Address:
      type: object
      properties:
        label: { type: string, maxLength: 50, example: home }
        street: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 255 }
        region: { type: string, maxLength: 255 }
        postal_code: { type: string, maxLength: 255 }
        country: { type: string, maxLength: 255 }
    Organization:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        title: { type: string, maxLength: 255 }
        department: { type: string, maxLength: 255 }
    Person:
      type: object
      required: [id, first_name, last_name, display_name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        middle_names:
          type: array
          items: { type: string }
        last_name: { type: string }
        display_name: { type: string }
        nickname: { type: string, nullable: true }
        pronouns: { type: string, nullable: true }
        birthdate: { type: string, format: date, nullable: true }
        emails:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/LabeledValue' }
        phone_numbers:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/LabeledValue' }
        addresses:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/Address' }
        organization:
          type: object
          allOf:
            - $ref: '#/components/schemas/Organization'
          nullable: true
        notes: { type: string, maxLength: 4096, nullable: true }
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
        is_favorite: { type: boolean }
        is_owner: { type: boolean, readOnly: true }
        owner_display_name: { type: string, nullable: true, readOnly: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at:
          type: string
          format: date-time
          nullable: true
    CreatePersonInput:
      type: object
      required: [first_name, last_name]
      properties:
        first_name: { type: string, maxLength: 255 }
        middle_names:
          type: array
          items: { type: string }
        last_name: { type: string, maxLength: 255 }
        nickname: { type: string, maxLength: 255 }
        pronouns: { type: string, maxLength: 255 }
        birthdate: { type: string, format: date }
        emails:
          type: array
          items: { $ref: '#/components/schemas/LabeledValue' }
        phone_numbers:
          type: array
          items: { $ref: '#/components/schemas/LabeledValue' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }
        organization:
          $ref: '#/components/schemas/Organization'
        notes: { type: string, maxLength: 4096 }
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
        is_favorite: { type: boolean, default: false }
    UpdatePersonInput:
      type: object
      properties:
        first_name: { type: string, maxLength: 255 }
        middle_names:
          type: array
          items: { type: string }
        last_name: { type: string, maxLength: 255 }
        nickname: { type: string, maxLength: 255 }
        pronouns: { type: string, maxLength: 255 }
        birthdate: { type: string, format: date }
        emails:
          type: array
          items: { $ref: '#/components/schemas/LabeledValue' }
        phone_numbers:
          type: array
          items: { $ref: '#/components/schemas/LabeledValue' }
        addresses:
          type: array
          items: { $ref: '#/components/schemas/Address' }
        organization:
          type: object
          allOf:
            - $ref: '#/components/schemas/Organization'
          nullable: true
        notes: { type: string, maxLength: 4096, nullable: true }
        custom_fields:
          $ref: '#/components/schemas/CustomFields'
        is_favorite: { type: boolean }
    PersonListResponse:
      type: object
      required: [data, page, page_size, total, total_pages]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Person' }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    Relationship:
      type: object
      required: [id, type, related_person_name, related_person_deleted]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [parent, child, spouse, sibling, partner]
          description: >-
            Already resolved from this person's perspective (e.g. if someone
            else recorded a Parent relationship pointing at this person, it
            reads here as Child).
        related_person_id:
          type: string
          format: uuid
          nullable: true
          description: Set when linked to an existing contact; omitted/null for a name-only relationship.
        related_person_name: { type: string }
        related_person_deleted:
          type: boolean
          description: True when related_person_id is linked but that contact is soft-deleted.
    CreateRelationshipInput:
      type: object
      required: [type]
      description: >-
        Exactly one of related_person_id/related_person_name must be set: a
        linked relationship points at an existing contact (its name is
        always resolved live); an unlinked relationship is just a name.
      properties:
        type:
          type: string
          enum: [parent, child, spouse, sibling, partner]
        related_person_id: { type: string, format: uuid }
        related_person_name: { type: string, maxLength: 255 }
    Share:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
    CreateShareInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    SyncAccount:
      type: object
      required: [id, provider, provider_account_id, sync_frequency_minutes, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid, nullable: true }
        provider: { type: string }
        provider_account_id: { type: string }
        display_name: { type: string, nullable: true, description: 'Human-readable label (e.g. the connected email) used to tell multiple accounts of the same provider apart.' }
        expires_at: { type: string, format: date-time, nullable: true }
        scope: { type: string }
        sync_cursor: { type: string }
        sync_frequency_minutes: { type: integer }
        status: { type: string }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SyncAccountListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SyncAccount' }
    CreateSyncAccountInput:
      type: object
      required: [provider, provider_account_id]
      properties:
        provider: { type: string, maxLength: 255 }
        provider_account_id: { type: string, maxLength: 255 }
        access_token: { type: string, nullable: true }
        refresh_token: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        scope: { type: string }
        sync_cursor: { type: string }
        sync_frequency_minutes: { type: integer, minimum: 1, default: 60 }
        status: { type: string }
    UpdateSyncAccountInput:
      type: object
      properties:
        provider: { type: string, nullable: true }
        provider_account_id: { type: string, nullable: true }
        access_token: { type: string, nullable: true }
        refresh_token: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        scope: { type: string, nullable: true }
        sync_cursor: { type: string, nullable: true }
        sync_frequency_minutes: { type: integer, minimum: 1, nullable: true }
        status: { type: string, nullable: true }
    GoogleOAuthBeginResponse:
      type: object
      required: [authorization_url, state]
      properties:
        authorization_url: { type: string, format: uri }
        state: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
