run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - gosec
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - errorlint

linters-settings:
  goimports:
    local-prefixes: github.com/scottfridlund/contacts/backend
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    # Test files may skip some strictness.
    - path: _test\.go
      linters:
        - gosec
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
